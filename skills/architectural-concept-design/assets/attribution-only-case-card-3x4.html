<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{building_name}} — {{card_id}}</title>
    <style>
      :root {
        --paper: #f3f0e8;
        --ink: #171817;
        --muted: #626560;
        --line: #cccbc4;
        --accent: #d34832;
        --tint: #e7e4da;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1500px;
        height: 2000px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        color: var(--ink);
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: 1500px;
        height: 2000px;
        padding: 108px 104px 88px;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(23, 24, 23, 0.035) 1px, transparent 1px) 0 0 / 14px 14px,
          var(--paper);
      }

      .topline,
      .main,
      .footer {
        position: relative;
        z-index: 1;
      }

      .topline {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 36px;
        padding-bottom: 42px;
        border-bottom: 6px solid var(--ink);
      }

      .eyebrow,
      .field-label,
      .footer-label {
        margin: 0;
        color: var(--muted);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .card-id {
        margin: 0;
        color: var(--accent);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.1em;
        line-height: 1.1;
        text-align: right;
      }

      .main {
        display: grid;
        grid-template-rows: auto 420px minmax(0, 1fr) auto;
        gap: 52px;
        padding: 72px 0 54px;
      }

      h1 {
        max-width: 1100px;
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
        font-size: 142px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .media {
        position: relative;
        margin: 0;
        overflow: hidden;
        border: 2px solid var(--ink);
        background: var(--tint);
      }

      .case-media {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .media-label {
        position: absolute;
        right: 18px;
        bottom: 16px;
        margin: 0;
        padding: 8px 11px;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .operation {
        position: relative;
        align-self: stretch;
        display: grid;
        align-content: end;
        min-height: 0;
        padding: 56px 58px;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
      }

      .operation .field-label { color: rgba(243, 240, 232, 0.68); }

      .operation-number {
        position: absolute;
        top: 28px;
        right: 34px;
        color: rgba(243, 240, 232, 0.08);
        font-family: Impact, Haettenschweiler, sans-serif;
        font-size: 540px;
        letter-spacing: -0.08em;
        line-height: 0.78;
        pointer-events: none;
      }

      .operation-copy {
        position: relative;
        z-index: 1;
      }

      .operation-summary {
        max-width: 1120px;
        margin: 22px 0 0;
        font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
        font-size: 58px;
        letter-spacing: -0.02em;
        line-height: 1.34;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tags li {
        border: 2px solid var(--ink);
        padding: 10px 16px;
        background: var(--paper);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.15;
      }

      .footer {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 28px;
        align-items: start;
        padding-top: 34px;
        border-top: 2px solid var(--line);
      }

      .source {
        overflow-wrap: anywhere;
        color: var(--ink);
        font-size: 20px;
        line-height: 1.45;
      }

      .source a { color: inherit; }

      @media (max-width: 760px) {
        html,
        body {
          width: auto;
          height: auto;
          overflow: auto;
        }

        .card {
          width: auto;
          height: auto;
          min-height: 100vh;
          padding: 36px 26px;
        }

        .topline { padding-bottom: 24px; }

        .main {
          gap: 30px;
          padding: 44px 0 34px;
        }

        h1 { font-size: 58px; }

        .media { height: 220px; }

        .operation { padding: 32px 28px; }

        .operation-number { font-size: 240px; }

        .operation-summary { font-size: 28px; }

        .footer { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <article class="card" data-card-id="{{card_id}}">
      <header class="topline">
        <p class="eyebrow">Attribution-only case study</p>
        <p class="card-id">{{card_id}}</p>
      </header>
      <main class="main">
        <h1>{{building_name}}</h1>
        <figure class="media">
          <img class="case-media" src="{{media_asset_path}}" alt="{{media_alt_text}}" />
          <figcaption class="media-label">Local visual study</figcaption>
        </figure>
        <section class="operation" aria-labelledby="operation-label">
          <span class="operation-number" aria-hidden="true">{{card_number}}</span>
          <div class="operation-copy">
            <p id="operation-label" class="field-label">Spatial operation</p>
            <p class="operation-summary">{{operation_summary}}</p>
          </div>
        </section>
        <ul class="tags" aria-label="Building tags">{{building_tags}}</ul>
      </main>
      <footer class="footer">
        <p class="footer-label">Attribution</p>
        <p class="source"><a href="{{source_locator}}">{{source_locator}}</a><br />Source record date: {{source_accessed_on}}</p>
      </footer>
    </article>
  </body>
</html>
